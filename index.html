<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文件云盘 · GitHub 上传器</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface-2: #1d222c;
    --border: #2a303c;
    --border-strong: #3a4152;
    --text: #e8eaef;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --accent-soft: rgba(79, 140, 255, 0.12);
    --ok: #35c07a;
    --warn: #e8a33d;
    --err: #f0626b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    background: radial-gradient(1200px 600px at 15% -10%, #1a2438 0%, transparent 60%), var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: 14px; line-height: 1.6; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 11px; flex: none;
    background: linear-gradient(140deg, #4f8cff, #7b5cff);
    display: grid; place-items: center;
    box-shadow: 0 8px 22px -8px rgba(79, 140, 255, 0.7);
  }
  .logo svg { width: 20px; height: 20px; fill: #fff; }
  h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -0.2px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }

  .repo-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 14px 7px 11px;
    color: var(--text); text-decoration: none; font-size: 13px;
    transition: border-color .18s, transform .18s;
  }
  .repo-chip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(53, 192, 122, .15); }
  .dot.off { background: var(--err); box-shadow: 0 0 0 3px rgba(240, 98, 107, .15); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 18px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .card-title { font-size: 14px; font-weight: 620; display: flex; align-items: center; gap: 8px; }

  .banner {
    display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap;
    background: rgba(232, 163, 61, .07); border: 1px solid rgba(232, 163, 61, .28);
    border-radius: 12px; padding: 13px 15px; margin-bottom: 18px; font-size: 13px;
    color: #e9c184;
  }
  .banner b { color: #f3d3a0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
  input[type="text"], input[type="password"] {
    width: 100%; background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 13px; font-family: inherit;
    outline: none; transition: border-color .16s, box-shadow .16s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input::placeholder { color: #5c6474; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
    padding: 8px 15px; border-radius: 10px; font-size: 13px; font-family: inherit;
    cursor: pointer; transition: background .16s, border-color .16s, transform .1s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); background: #202634; }
  .btn:active { transform: scale(.975); }
  .btn.ghost { background: transparent; border-color: var(--border); }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .btn.danger { color: var(--err); border-color: rgba(240, 98, 107, .35); }
  .btn.danger:hover { background: rgba(240, 98, 107, .1); border-color: var(--err); }

  .drop {
    border: 1.5px dashed var(--border-strong); border-radius: 12px;
    padding: 34px 20px; text-align: center; cursor: pointer;
    transition: border-color .18s, background .18s; background: rgba(255, 255, 255, .012);
  }
  .drop:hover { border-color: var(--accent); background: var(--accent-soft); }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); border-style: solid; }
  .drop.off { opacity: .45; cursor: not-allowed; }
  .drop.off:hover { border-color: var(--border-strong); background: rgba(255,255,255,.012); }
  .drop svg { width: 34px; height: 34px; stroke: var(--muted); margin-bottom: 8px; }
  .drop.over svg { stroke: var(--accent); }
  .drop-main { font-size: 14px; font-weight: 600; }
  .drop-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }

  .hint {
    display: flex; gap: 9px; align-items: flex-start;
    font-size: 12.5px; color: var(--muted); margin-top: 12px;
    background: rgba(255,255,255,.02); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }

  .queue { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .item {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; animation: fade .22s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .item .fname { font-weight: 550; font-size: 13px; word-break: break-all; }
  .item .fmeta { color: var(--muted); font-size: 11.5px; }
  .grow { flex: 1; min-width: 0; }
  .badge {
    font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted); flex: none;
  }
  .badge.ok { color: var(--ok); border-color: rgba(53,192,122,.35); background: rgba(53,192,122,.1); }
  .badge.err { color: var(--err); border-color: rgba(240,98,107,.35); background: rgba(240,98,107,.1); }
  .badge.run { color: var(--accent); border-color: rgba(79,140,255,.4); background: var(--accent-soft); }
  .bar { height: 3px; border-radius: 3px; background: var(--border); overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4f8cff, #7b5cff); transition: width .2s; }

  .pathbar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--muted); margin-bottom: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .crumb { cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: background .15s; }
  .crumb:hover { background: var(--surface-2); color: var(--accent); }

  .stat { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
    padding: 4px 11px; border-radius: 999px; font-size: 12px; font-family: inherit; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.on { border-color: rgba(79,140,255,.55); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .files { display: flex; flex-direction: column; gap: 6px; }
  .frow {
    display: flex; align-items: center; gap: 12px; padding: 9px 12px;
    border-radius: 10px; border: 1px solid transparent; transition: background .15s, border-color .15s;
  }
  .frow:hover { background: var(--surface-2); border-color: var(--border); }
  .ficon { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .ficon svg { width: 15px; height: 15px; stroke: var(--muted); }
  .frow:hover .ficon svg { stroke: var(--accent); }
  .fname { font-weight: 520; font-size: 13px; word-break: break-all; }
  .frow .dir { cursor: pointer; color: var(--accent); }
  .fmeta { color: var(--muted); font-size: 11.5px; }
  .lock { color: #ff5d5d; font-size: 11.5px; font-weight: 600; margin-left: 6px; white-space: nowrap; }
  .actions { display: flex; gap: 6px; flex: none; }
  .actions a.btn { text-decoration: none; color: var(--text); display: inline-flex; align-items: center; }
  .empty { text-align: center; padding: 34px 10px; color: var(--muted); font-size: 13px; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
    background: #202634; border: 1px solid var(--border-strong); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 13px;
    box-shadow: 0 16px 40px -12px rgba(0,0,0,.8); opacity: 0; pointer-events: none;
    transition: opacity .22s, transform .22s; z-index: 40; max-width: 88vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: rgba(240,98,107,.5); }
  .toast.ok { border-color: rgba(53,192,122,.5); }

  .spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); border-top-color: var(--accent); animation: sp .7s linear infinite; display: inline-block; }
  @keyframes sp { to { transform: rotate(360deg); } }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .checkbox { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
  .checkbox input { accent-color: var(--accent); width: 14px; height: 14px; }

  @media (max-width: 620px) {
    .wrap { padding: 18px 14px 70px; }
    .card { padding: 16px; }
    .actions { gap: 4px; }
    .actions .btn { padding: 4px 7px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>
      </div>
      <div>
        <h1>文件云盘</h1>
        <div class="sub">拖拽上传，云端保存，随时下载 · 无需登录</div>
      </div>
    </div>
    <a class="repo-chip" id="repoLink" href="#" target="_blank" rel="noopener">
      <span class="dot off" id="statusDot"></span>
      <span id="repoLabel">文件云盘</span>
    </a>
  </header>

  <!-- 后端未配置提示 -->
  <div class="banner" id="banner" hidden>
    <span>⚠️</span>
    <span class="grow">
      <b>上传后端尚未配置</b>，现在只能浏览和下载。请先部署 Cloudflare Worker，并把地址填进仓库的
      <code>backend.json</code>。
    </span>
    <button class="btn sm ghost" id="btnReload">重新载入配置</button>
  </div>

  <!-- 上传 -->
  <section class="card">
    <div class="card-head">
      <div class="card-title">上传文件</div>
      <div class="row">
        <input id="fPass" type="password" placeholder="上传/删除口令" autocomplete="current-password" style="width:150px" />
        <input id="fFolder" type="text" placeholder="目标子目录（可留空）" autocomplete="off" style="width:180px" />
      </div>
    </div>

    <div class="drop" id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <div class="drop-main" id="dropMain">拖拽文件到这里，或点击选择</div>
      <div class="drop-sub" id="dropSub">支持多文件 / 整个文件夹，单文件最大 100 MB</div>
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn sm" id="btnPickFiles">选择文件</button>
      <button class="btn sm" id="btnPickFolder">选择整个文件夹</button>
      <span class="checkbox" style="margin-left:auto">同名文件不会被覆盖</span>
      <button class="btn sm ghost" id="btnClearQueue">清空列表</button>
    </div>

    <input type="file" id="fileInput" multiple hidden />
    <input type="file" id="folderInput" webkitdirectory directory multiple hidden />

    <div class="queue" id="queue"></div>
  </section>

  <!-- 云端文件 -->
  <section class="card">
    <div class="card-head">
      <div class="card-title">云端文件<span class="stat" id="statLine"></span></div>
      <div class="row">
        <button class="btn sm ghost" id="btnRefresh">刷新</button>
      </div>
    </div>

    <div class="pathbar" id="pathbar"></div>
    <div class="filters" id="filters"></div>
    <div class="files" id="fileList">
      <div class="empty">正在加载…</div>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ====== 可修改的仓库参数 ======
  const CFG = {
    owner: 'polytrack114514',
    repo: 'storage',
    branch: 'main',
  };
  // =============================

  const API = 'https://api.github.com';
  const MAX_FILE = 100 * 1024 * 1024;
  const PROTECTED = ['backend.json', 'index.html', 'README.md'];
  const WARN_FILE = 20 * 1024 * 1024;

  const $ = (id) => document.getElementById(id);

  let backend = { workerUrl: '', password: '' };
  let ready = false;
  let currentPath = '';
  let running = false;
  let fileItems = [];
  let fileFilter = 'all';
  const queue = [];

  // ---------- 口令 ----------
  const PASS_KEY = 'fc_pass';

  function storedPass() {
    try { return localStorage.getItem(PASS_KEY) || ''; } catch (e) { return ''; }
  }

  /** 取口令；为空时提示并聚焦输入框，返回 null */
  function getPass() {
    const v = String($('fPass').value || '').trim();
    if (!v) {
      toast('请先输入上传/删除口令', 'err');
      $('fPass').focus();
      return null;
    }
    return v;
  }

  // ---------- 文件分类 ----------
  const CATS = [
    { key: 'all', label: '全部' },
    { key: 'image', label: '图片' },
    { key: 'doc', label: '文档' },
    { key: 'zip', label: '压缩包' },
    { key: 'other', label: '其他' },
  ];
  const CAT_EXT = {
    image: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico', 'avif', 'heic', 'tif', 'tiff'],
    doc: ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'md', 'csv', 'json', 'html', 'htm', 'xml', 'rtf', 'odt', 'ods', 'odp', 'epub'],
    zip: ['zip', 'rar', '7z', 'tar', 'gz', 'bz2', 'xz', 'tgz', 'zst', 'iso'],
  };

  function catOf(name) {
    const i = String(name).lastIndexOf('.');
    if (i <= 0) return 'other';
    const ext = String(name).slice(i + 1).toLowerCase();
    for (const k in CAT_EXT) {
      if (CAT_EXT[k].indexOf(ext) >= 0) return k;
    }
    return 'other';
  }

  // ---------- 小工具 ----------
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = 'toast' + (kind ? ' ' + kind : ''); }, 3400);
  }

  function fmtSize(n) {
    if (n === undefined || n === null) return '';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
    return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    const p = (n) => (n < 10 ? '0' + n : '' + n);
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function siteBase() {
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      return location.origin + location.pathname.replace(/[^\/]*$/, '');
    }
    return 'https://polytrack114514.github.io/storage/';
  }

  function jumpUrl(p) {
    return siteBase() + p.split('/').map(encodeURIComponent).join('/');
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function encPath(p) {
    return String(p || '').split('/').filter(Boolean).map(encodeURIComponent).join('/');
  }

  function ghPath(p, withRef) {
    let u = '/repos/' + encodeURIComponent(CFG.owner) + '/' + encodeURIComponent(CFG.repo) + '/contents';
    const enc = encPath(p);
    if (enc) u += '/' + enc;
    if (withRef !== false) u += '?ref=' + encodeURIComponent(CFG.branch);
    return u;
  }

  function workerBase() {
    return backend.workerUrl.replace(/\/+$/, '');
  }

  // ---------- 读取后端配置 ----------
  async function loadBackendConfig() {
    let cfg = null;
    try {
      const res = await fetch('backend.json?t=' + Date.now(), { cache: 'no-store' });
      if (res.ok) cfg = await res.json();
    } catch (e) { /* 本地直开或文件缺失 */ }

    backend.workerUrl = (cfg && String(cfg.workerUrl || '').trim()) || '';
    backend.password = (cfg && cfg.password) || '';
    ready = !!backend.workerUrl;

    $('banner').hidden = ready;
    $('statusDot').className = 'dot ' + (ready ? 'on' : 'off');
    $('drop').classList.toggle('off', !ready);
    $('dropMain').textContent = ready ? '拖拽文件到这里，或点击选择' : '上传后端未配置，暂时无法上传';
    $('btnPickFiles').disabled = !ready;
    $('btnPickFolder').disabled = !ready;
    return ready;
  }

  // ---------- 请求封装 ----------
  async function getJSON(url) {
    const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) {
      const err = new Error('HTTP ' + res.status);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  function postJSON(url, body, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      if (onProgress) {
        xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      }
      xhr.onload = () => {
        let data = null;
        try { data = xhr.responseText ? JSON.parse(xhr.responseText) : null; } catch (e) {}
        if (xhr.status >= 200 && xhr.status < 300) return resolve(data);
        const msg = (data && (data.error || data.message)) || ('HTTP ' + xhr.status);
        const err = new Error(msg); err.status = xhr.status; reject(err);
      };
      xhr.onerror = () => reject(new Error('网络错误：无法连接上传后端'));
      xhr.ontimeout = () => reject(new Error('请求超时'));
      xhr.send(JSON.stringify(body));
    });
  }

  // ---------- 列表 ----------
  async function listDir(path) {
    if (ready) {
      const url = workerBase() + '/list?path=' + encodeURIComponent(path || '');
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }
    return getJSON(API + ghPath(path));
  }

  async function loadFiles(path) {
    currentPath = path || '';
    renderPathbar();
    $('fileList').innerHTML = '<div class="empty"><span class="spin"></span> 加载中…</div>';

    try {
      let data;
      try {
        data = await listDir(currentPath);
      } catch (e) {
        if (e.status === 404) {
          fileItems = [];
          renderFiles();
          return;
        }
        throw e;
      }
      const items = Array.isArray(data) ? data : (data ? [data] : []);
      if (!items.length) {
        fileItems = [];
        renderFiles();
        return;
      }
      const pinned = (it) => {
        if (currentPath || it.type === 'dir') return -1;
        return PROTECTED.indexOf(it.name);
      };
      items.sort((a, b) => {
        const pa = pinned(a), pb = pinned(b);
        if (pa >= 0 || pb >= 0) {
          if (pa < 0) return 1;
          if (pb < 0) return -1;
          return pa - pb;
        }
        const ad = a.type === 'dir', bd = b.type === 'dir';
        if (ad !== bd) return ad ? -1 : 1;
        if (ad) return a.name.localeCompare(b.name);
        const ta = a.uploadedAt ? Date.parse(a.uploadedAt) : 0;
        const tb = b.uploadedAt ? Date.parse(b.uploadedAt) : 0;
        if (ta !== tb) return tb - ta;
        return a.name.localeCompare(b.name);
      });

      fileItems = items;
      renderFiles();
    } catch (e) {
      $('fileList').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
    }
  }

  function renderFiles() {
    const files = fileItems.filter((it) => it.type !== 'dir');
    const counts = { all: files.length, image: 0, doc: 0, zip: 0, other: 0 };
    files.forEach((it) => { counts[catOf(it.name)]++; });

    $('filters').innerHTML = files.length
      ? CATS.map((c) =>
          '<button class="chip' + (fileFilter === c.key ? ' on' : '') + '" data-cat="' + c.key + '">' +
            c.label + ' ' + counts[c.key] + '</button>').join('')
      : '';
    $('filters').querySelectorAll('.chip').forEach((el) => {
      el.addEventListener('click', () => { fileFilter = el.dataset.cat; renderFiles(); });
    });

    const items = fileItems.filter((it) =>
      it.type === 'dir' || fileFilter === 'all' || catOf(it.name) === fileFilter);

    if (!items.length) {
      $('fileList').innerHTML = '<div class="empty">' +
        (fileFilter === 'all' ? '这里还没有文件，上传第一个吧' : '该分类下没有文件') + '</div>';
      return;
    }

    $('fileList').innerHTML = items.map((it) => {
        const isDir = it.type === 'dir';
        const icon = isDir
          ? '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
        const p = currentPath ? currentPath + '/' + it.name : it.name;
        const locked = !isDir && !currentPath && PROTECTED.indexOf(it.name) >= 0;
        return '<div class="frow">' +
          '<span class="ficon">' + icon + '</span>' +
          '<div class="grow">' +
            '<div class="fname ' + (isDir ? 'dir' : '') + '" data-path="' + esc(p) + '" data-dir="' + isDir + '">' + esc(it.name) +
              (locked ? '<span class="lock">【基础文件，不可删除】</span>' : '') + '</div>' +
            '<div class="fmeta">' + (isDir ? '文件夹' : fmtSize(it.size) + (it.uploadedAt ? ' · 上传于 ' + fmtTime(it.uploadedAt) : '')) + '</div>' +
          '</div>' +
          '<div class="actions">' +
            (isDir ? '' : '<a class="btn sm" href="' + esc(jumpUrl(p)) + '" target="_blank" rel="noopener">跳转访问</a>') +
            (isDir ? '' : '<button class="btn sm" data-dl="' + esc(p) + '">下载</button>') +
            (locked ? '' : '<button class="btn sm danger" data-del="' + esc(p) + '" data-sha="' + (it.sha || '') + '" data-dir="' + isDir + '">删除</button>') +
          '</div>' +
        '</div>';
      }).join('');

      $('fileList').querySelectorAll('[data-path]').forEach((el) => {
        if (el.dataset.dir === 'true') el.addEventListener('click', () => loadFiles(el.dataset.path));
      });
      $('fileList').querySelectorAll('[data-dl]').forEach((el) => {
        el.addEventListener('click', () => downloadFile(el.dataset.dl));
      });
      $('fileList').querySelectorAll('[data-del]').forEach((el) => {
        el.addEventListener('click', () => deleteFile(el.dataset.del, el.dataset.sha, el.dataset.dir === 'true'));
      });
  }

  // ---------- 仓库统计 ----------
  async function loadStats() {
    if (!ready) return;
    try {
      const res = await fetch(workerBase() + '/stats', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const s = await res.json();
      $('statLine').textContent = '共 ' + (s.files || 0) + ' 个文件 · ' + fmtSize(s.bytes || 0);
    } catch (e) {
      $('statLine').textContent = '';
    }
  }

  function renderPathbar() {
    const parts = currentPath.split('/').filter(Boolean);
    let html = '<span class="crumb" data-path="">根目录</span>';
    let acc = '';
    parts.forEach((p) => {
      acc = acc ? acc + '/' + p : p;
      html += '<span>/</span><span class="crumb" data-path="' + esc(acc) + '">' + esc(p) + '</span>';
    });
    $('pathbar').innerHTML = html;
    $('pathbar').querySelectorAll('.crumb').forEach((el) => {
      el.addEventListener('click', () => loadFiles(el.dataset.path));
    });
  }

  // ---------- 下载 ----------
  function downloadFile(path) {
    const a = document.createElement('a');
    if (ready) {
      a.href = workerBase() + '/download?path=' + encodeURIComponent(path);
      document.body.appendChild(a);
      a.click();
      a.remove();
      return;
    }
    // 未配置后端时退化为 GitHub 原始链接
    a.href = 'https://raw.githubusercontent.com/' + CFG.owner + '/' + CFG.repo + '/' +
      encodeURI(CFG.branch) + '/' + encPath(path);
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  // ---------- 删除 ----------
  async function deleteFile(path, sha, isDir) {
    if (!ready) { toast('上传后端未配置，无法删除', 'err'); return; }
    if (!isDir && !path.includes('/') && PROTECTED.indexOf(path) >= 0) {
      toast('「' + path + '」是基础文件，不可删除', 'err');
      return;
    }
    const target = isDir ? '文件夹「' + path + '」及其中所有文件' : '「' + path + '」';
    const pass = getPass();
    if (!pass) return;
    if (!confirm('确定要删除 ' + target + ' 吗？会直接提交到仓库，无法撤销。')) return;
    try {
      if (isDir) await deleteDir(path, pass);
      else await postJSON(workerBase() + '/delete', { path, sha: sha || '', password: pass, message: 'delete: ' + path });
      toast('已删除 ' + path, 'ok');
      loadFiles(currentPath);
      loadStats();
    } catch (e) {
      toast('删除失败：' + e.message, 'err');
    }
  }

  async function deleteDir(path, pass) {
    const list = await listDir(path);
    if (!Array.isArray(list)) return;
    for (const it of list.slice().reverse()) {
      const child = path + '/' + it.name;
      if (it.type === 'dir') await deleteDir(child, pass);
      else await postJSON(workerBase() + '/delete', { path: child, sha: it.sha, password: pass });
    }
  }

  // ---------- 上传队列 ----------
  function renderQueue() {
    const box = $('queue');
    if (!queue.length) { box.innerHTML = ''; return; }
    box.innerHTML = queue.map((it) => {
      const cls = it.status === 'ok' ? 'ok' : it.status === 'err' ? 'err' : it.status === 'run' ? 'run' : '';
      const label = it.status === 'ok' ? '完成'
        : it.status === 'err' ? '失败'
        : it.status === 'run' ? '上传中'
        : it.status === 'skip' ? '已跳过' : '等待';
      return '<div class="item">' +
        '<span class="' + (it.status === 'run' ? 'spin' : '') + '"></span>' +
        '<div class="grow">' +
          '<div class="fname">' + esc(it.path) + '</div>' +
          '<div class="fmeta">' + fmtSize(it.size) +
            (it.error ? ' · <span style="color:var(--err)">' + esc(it.error) + '</span>' : '') +
          '</div>' +
          (it.status === 'run' ? '<div class="bar"><i style="width:' + (it.progress * 100).toFixed(0) + '%"></i></div>' : '') +
        '</div>' +
        '<span class="badge ' + cls + '">' + label + '</span>' +
      '</div>';
    }).join('');
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const s = String(r.result);
        const i = s.indexOf(',');
        resolve(i >= 0 ? s.slice(i + 1) : s);
      };
      r.onerror = () => reject(r.error || new Error('读取文件失败'));
      r.readAsDataURL(file);
    });
  }

  function addFiles(fileList) {
    if (!ready) { toast('上传后端未配置，暂时无法上传', 'err'); return; }
    if (!getPass()) return;
    const folder = $('fFolder').value.trim().replace(/^\/+|\/+$/g, '');
    let added = 0;
    for (const file of Array.from(fileList)) {
      const rel = file.webkitRelativePath || file.name;
      if (!folder && rel.indexOf('/') < 0 && PROTECTED.indexOf(rel) >= 0) {
        toast('「' + rel + '」是基础文件，已跳过', 'err');
        continue;
      }
      if (file.size > MAX_FILE) {
        toast('「' + file.name + '」超过 100 MB，无法上传', 'err');
        continue;
      }
      const path = (folder ? folder + '/' : '') + rel;
      queue.push({ file, path, size: file.size, status: 'wait', progress: 0, error: '' });
      added++;
    }
    renderQueue();
    if (added) runQueue();
  }

  async function runQueue() {
    if (running) return;
    running = true;
    try {
      while (true) {
        const next = queue.find((it) => it.status === 'wait');
        if (!next) break;
        await uploadOne(next);
      }
    } finally {
      running = false;
    }
    const okCount = queue.filter((i) => i.status === 'ok').length;
    if (okCount) {
      toast('已上传 ' + okCount + ' 个文件', 'ok');
      loadFiles(currentPath);
      loadStats();
    }
  }

  async function uploadOne(item) {
    const pass = getPass();
    if (!pass) {
      item.status = 'err';
      item.error = '缺少口令';
      renderQueue();
      return;
    }
    item.status = 'run';
    item.progress = 0;
    renderQueue();
    try {
      if (item.size > WARN_FILE) toast('「' + item.file.name + '」较大，上传可能需要一些时间');

      // 不允许覆盖：目标位置已存在同名文件时直接跳过
      try {
        const list = await listDir(currentPath);
        if (Array.isArray(list) && list.some((x) => x.path === item.path)) {
          item.status = 'skip';
          item.error = '已存在同名文件，不能覆盖';
          renderQueue();
          return;
        }
      } catch (e) { /* 探测失败时交给后端拦截 */ }

      const b64 = await fileToBase64(item.file);
      await postJSON(workerBase() + '/upload', {
        path: item.path,
        content: b64,
        password: pass,
        message: 'upload: ' + item.path,
      }, (p) => {
        item.progress = p;
        renderQueue();
      });

      item.status = 'ok';
      item.progress = 1;
      item.error = '';
      renderQueue();
    } catch (e) {
      item.status = 'err';
      item.error = e.message;
      renderQueue();
    }
  }

  // ---------- 事件 ----------
  function bind() {
    $('btnReload').addEventListener('click', async () => {
      const ok = await loadBackendConfig();
      toast(ok ? '后端已就绪' : '仍未读到 backend.json 里的 workerUrl', ok ? 'ok' : 'err');
      if (ok) loadFiles(currentPath);
      if (ok) loadStats();
    });

    const drop = $('drop');
    $('btnPickFiles').addEventListener('click', () => ready && $('fileInput').click());
    $('btnPickFolder').addEventListener('click', () => ready && $('folderInput').click());
    drop.addEventListener('click', () => ready && $('fileInput').click());

    $('fileInput').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
    $('folderInput').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });

    ['dragenter', 'dragover'].forEach((ev) => {
      drop.addEventListener(ev, (e) => { e.preventDefault(); if (ready) drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach((ev) => {
      drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', (e) => {
      if (!ready) { toast('上传后端未配置，暂时无法上传', 'err'); return; }
      const files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length) addFiles(files);
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());

    $('btnClearQueue').addEventListener('click', () => {
      for (let i = queue.length - 1; i >= 0; i--) {
        if (queue[i].status !== 'run') queue.splice(i, 1);
      }
      renderQueue();
    });
    $('btnRefresh').addEventListener('click', () => { loadFiles(currentPath); loadStats(); });
    $('fPass').addEventListener('input', (e) => {
      try { localStorage.setItem(PASS_KEY, e.target.value); } catch (err) {}
    });
  }

  // ---------- 启动 ----------
  async function init() {
    $('repoLink').href = 'https://github.com/' + CFG.owner + '/' + CFG.repo;
    $('repoLabel').textContent = CFG.owner + '/' + CFG.repo;
    bind();
    renderPathbar();
    await loadBackendConfig();
    $('fPass').value = storedPass() || backend.password || '';
    loadFiles('');
    loadStats();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
