<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Saturn V 3D · Launch Complex 39A</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    padding: 14px 18px; background: rgba(8, 12, 22, 0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(120, 180, 255, 0.18);
    border-radius: 12px; max-width: 320px; font-size: 13px; line-height: 1.6;
  }
  #hud h1 { font-size: 16px; margin-bottom: 6px; letter-spacing: 1px; color: #ffcf6b; }
  #hud .sub { opacity: 0.7; font-size: 12px; margin-bottom: 8px; }
  #hud kbd { display: inline-block; padding: 1px 6px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; font-size: 11px; background: rgba(255,255,255,0.06); }
  #controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 8px; padding: 10px; background: rgba(8, 12, 22, 0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(120, 180, 255, 0.18); border-radius: 12px;
    flex-wrap: wrap; justify-content: center; max-width: 92vw;
  }
  #controls button {
    background: rgba(120, 180, 255, 0.1); color: #fff; border: 1px solid rgba(120, 180, 255, 0.3);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    transition: all 0.15s ease; white-space: nowrap;
  }
  #controls button:hover:not(:disabled) { background: rgba(120, 180, 255, 0.25); border-color: rgba(120, 180, 255, 0.5); }
  #controls button.active { background: rgba(255, 207, 107, 0.25); border-color: #ffcf6b; color: #ffcf6b; }
  #controls button:disabled { opacity: 0.35; cursor: not-allowed; }
  #controls .sep { width: 1px; background: rgba(255,255,255,0.15); margin: 2px 4px; }
  #info {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    padding: 12px 16px; background: rgba(8, 12, 22, 0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(120, 180, 255, 0.18);
    border-radius: 12px; font-size: 12px; min-width: 220px; text-align: right;
  }
  #info .stage { color: #ffcf6b; font-weight: bold; font-size: 13px; }
  #info .label { opacity: 0.6; font-size: 11px; }
  #stageLabel {
    position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
    padding: 6px 14px; background: rgba(255, 207, 107, 0.2);
    border: 1px solid #ffcf6b; border-radius: 6px; color: #ffcf6b;
    font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    white-space: nowrap;
  }
  #stageLabel.show { opacity: 1; }
  #loading {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: #05070d; color: #ffcf6b; font-size: 14px; letter-spacing: 2px;
  }
  #loading.gone { opacity: 0; pointer-events: none; transition: opacity 0.6s; }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">LOADING LAUNCH COMPLEX 39A…</div>

<div id="hud">
  <h1>SATURN V · LC-39A</h1>
  <div class="sub">肯尼迪航天中心 39A 发射场 · 1969</div>
  <div><kbd>拖动</kbd> 旋转视角</div>
  <div><kbd>滚轮</kbd> 缩放</div>
  <div><kbd>右键拖动</kbd> 平移</div>
</div>

<div id="info">
  <div class="label">总高度</div><div class="stage">110.6 m</div>
  <div class="label">起飞质量</div><div class="stage">2,970 t</div>
  <div class="label">LEO 运力</div><div class="stage">118 t</div>
  <div class="label">登月运力</div><div class="stage">48.6 t</div>
</div>

<div id="controls">
  <button id="btnExplode">🔍 拆解视图</button>
  <button id="btnIgnite">🔥 点火升空</button>
  <div class="sep"></div>
  <button id="btnSep1">① 一级分离</button>
  <button id="btnSep2">② 二级分离</button>
  <button id="btnSep3">③ 三级分离</button>
  <div class="sep"></div>
  <button id="btnReset">↻ 重置</button>
</div>

<div id="stageLabel"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============ 场景 ============
const app = document.getElementById('app');
const scene = new THREE.Scene();

// 渐变天空: 黄昏发射氛围
{
  const skyGeo = new THREE.SphereGeometry(2000, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor: { value: new THREE.Color(0x0a0f1f) },
      midColor: { value: new THREE.Color(0x2a1810) },
      bottomColor: { value: new THREE.Color(0xff8844) }
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main(){
        vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor;
      varying vec3 vWorldPos;
      void main(){
        float h = normalize(vWorldPos).y;
        vec3 c = h > 0.0 ? mix(midColor, topColor, smoothstep(0.0, 0.6, h))
                        : mix(midColor, bottomColor, smoothstep(0.0, -0.3, h));
        gl_FragColor = vec4(c, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}
scene.fog = new THREE.FogExp2(0x1a0f08, 0.0028);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(160, 100, 220);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 40;
controls.maxDistance = 700;
controls.target.set(0, 55, 0);

// ============ 光照 ============
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

// 夕阳
const sun = new THREE.DirectionalLight(0xffb070, 1.6);
sun.position.set(300, 200, 100);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -250;
sun.shadow.camera.right = 250;
sun.shadow.camera.top = 250;
sun.shadow.camera.bottom = -250;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 800;
sun.shadow.bias = -0.0005;
scene.add(sun);

// 冷色补光 (天空)
const fill = new THREE.DirectionalLight(0x6090ff, 0.3);
fill.position.set(-200, 100, -100);
scene.add(fill);

// ============ 星空 ============
function makeStars() {
  const geo = new THREE.BufferGeometry();
  const count = 2500;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 1800 + Math.random() * 1500;
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2 * Math.random() - 1);
    positions[i*3]   = r * Math.sin(p) * Math.cos(t);
    positions[i*3+1] = r * Math.cos(p);
    positions[i*3+2] = r * Math.sin(p) * Math.sin(t);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, sizeAttenuation: true, transparent: true, opacity: 0.7 }));
}
scene.add(makeStars());

// ============ 远景山脉 (低多边形) ============
function makeMountains() {
  const group = new THREE.Group();
  for (let layer = 0; layer < 3; layer++) {
    const w = 2500, segs = 60, h = 80 + layer * 40, depth = 800 + layer * 200;
    const pts = [];
    for (let i = 0; i <= segs; i++) pts.push(new THREE.Vector2(-w/2 + i * w/segs, 0));
    const positions = [];
    const indices = [];
    for (let i = 0; i < segs; i++) {
      const x1 = -w/2 + i * w/segs;
      const x2 = -w/2 + (i+1) * w/segs;
      const y1 = (Math.sin(i * 0.7) * 0.3 + Math.sin(i * 1.3) * 0.4 + Math.cos(i * 0.5) * 0.3 + 0.5) * h;
      const y2 = (Math.sin((i+1) * 0.7) * 0.3 + Math.sin((i+1) * 1.3) * 0.4 + Math.cos((i+1) * 0.5) * 0.3 + 0.5) * h;
      const base = positions.length / 3;
      positions.push(x1, 0, -depth/2,  x2, 0, -depth/2,  x2, y2, -depth/2,  x1, y1, -depth/2);
      indices.push(base, base+1, base+2, base, base+2, base+3);
      // 后面
      const base2 = positions.length / 3;
      positions.push(x1, 0, depth/2,  x2, 0, depth/2,  x2, y2 * 0.8, depth/2,  x1, y1 * 0.8, depth/2);
      indices.push(base2+2, base2+1, base2, base2+3, base2+2, base2);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    const color = new THREE.Color().lerpColors(new THREE.Color(0x1a1525), new THREE.Color(0x3a2535), layer / 2);
    const mat = new THREE.MeshBasicMaterial({ color, fog: true });
    const m = new THREE.Mesh(geo, mat);
    group.add(m);
  }
  return group;
}
scene.add(makeMountains());

// ============ 地面 (混凝土发射区) ============
const groundGroup = new THREE.Group();
{
  // 大片混凝土地坪
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(800, 800),
    new THREE.MeshStandardMaterial({ color: 0x5a5a5e, roughness: 0.95, metalness: 0.05 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  groundGroup.add(floor);

  // 周边沙地
  const sand = new THREE.Mesh(
    new THREE.RingGeometry(400, 700, 32),
    new THREE.MeshStandardMaterial({ color: 0x6b4a30, roughness: 1.0, metalness: 0.0 })
  );
  sand.rotation.x = -Math.PI / 2;
  sand.position.y = 0.02;
  sand.receiveShadow = true;
  groundGroup.add(sand);

  // 发射区标线
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcf6b, transparent: true, opacity: 0.5 });
  for (let i = 0; i < 4; i++) {
    const line = new THREE.Mesh(new THREE.PlaneGeometry(60, 0.3), lineMat);
    line.rotation.x = -Math.PI / 2;
    line.position.set(0, 0.05, -30 + i * 20);
    groundGroup.add(line);
  }
}
groundGroup.position.y = -0.5;
scene.add(groundGroup);

// ============ 火焰导流槽 ============
const flameTrench = new THREE.Group();
{
  // 中心深沟 (火焰往下导)
  const trench = new THREE.Mesh(
    new THREE.BoxGeometry(8, 4, 22),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 })
  );
  trench.position.set(0, -2, 0);
  flameTrench.add(trench);

  // 导流槽两侧混凝土挡墙
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x888880, roughness: 0.95, metalness: 0.05 });
  const w1 = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 24), wallMat);
  w1.position.set(5, -0.5, 0); w1.castShadow = true; w1.receiveShadow = true;
  flameTrench.add(w1);
  const w2 = w1.clone(); w2.position.x = -5; flameTrench.add(w2);

  // 挡墙顶部金属扶手
  const railMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.3 });
  const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 24), railMat);
  r1.position.set(5, 1.3, 0); flameTrench.add(r1);
  const r2 = r1.clone(); r2.position.x = -5; flameTrench.add(r2);
}
scene.add(flameTrench);

// ============ 发射塔 (脚手架式) ============
const launchTower = new THREE.Group();
const TOWER_X = 28; // 塔中心X (火箭在 0)
const steelMat = new THREE.MeshStandardMaterial({ color: 0xc8453a, roughness: 0.55, metalness: 0.5 }); // NASA 标志性红
const steelDark = new THREE.MeshStandardMaterial({ color: 0x6a2520, roughness: 0.6, metalness: 0.5 });
const platformMat = new THREE.MeshStandardMaterial({ color: 0x444a52, roughness: 0.5, metalness: 0.6 });

function beam(w, h, d, mat = steelMat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

// 4根主立柱
const towerH = 110;
for (let i = 0; i < 4; i++) {
  const sx = (i % 2 === 0 ? -1 : 1) * 4;
  const sz = (i < 2 ? -1 : 1) * 4;
  const col = beam(0.6, towerH, 0.6, steelMat);
  col.position.set(TOWER_X + sx, towerH / 2, sz);
  launchTower.add(col);
}

// 9层平台 + 横向连接
const platformYs = [10, 22, 34, 46, 58, 70, 82, 94, 102];
platformYs.forEach((y, idx) => {
  // 横梁 (4面)
  for (let s = -1; s <= 1; s += 2) {
    const bx = beam(8.2, 0.4, 0.4, steelDark);
    bx.position.set(TOWER_X, y, s * 4);
    launchTower.add(bx);
    const bz = beam(0.4, 0.4, 8.2, steelDark);
    bz.position.set(TOWER_X + s * 4, y, 0);
    launchTower.add(bz);
  }
  // 平台地板 (朝火箭一侧延伸)
  const floorW = 4.5;
  const plat = new THREE.Mesh(
    new THREE.BoxGeometry(floorW, 0.3, 8.2),
    platformMat
  );
  plat.position.set(TOWER_X - floorW/2, y, 0);
  plat.castShadow = true; plat.receiveShadow = true;
  launchTower.add(plat);

  // 平台栏杆
  const railMat2 = new THREE.MeshStandardMaterial({ color: 0xffcf6b, metalness: 0.7, roughness: 0.3 });
  for (let s = -1; s <= 1; s += 2) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(floorW, 0.05, 0.05), railMat2);
    rail.position.set(TOWER_X - floorW/2, y + 0.9, s * 4);
    launchTower.add(rail);
  }

  // X形交叉支撑 (装饰)
  if (idx % 2 === 0) {
    for (let side = -1; side <= 1; side += 2) {
      const x1 = beam(0.2, 11, 0.2, steelDark);
      x1.position.set(TOWER_X + side * 4, y + 6, 0);
      x1.rotation.z = Math.PI / 4 * (side * 0.3);
      launchTower.add(x1);
    }
  }
});

// 顶部避雷针/天线
const tip = new THREE.Mesh(
  new THREE.CylinderGeometry(0.1, 0.1, 8, 8),
  new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8 })
);
tip.position.set(TOWER_X, towerH + 4, 0);
launchTower.add(tip);

// ============ 脐带摆臂 (勤务臂) ============
const serviceArms = [];
const armYs = [82, 94, 70, 58, 46];
armYs.forEach((y, idx) => {
  const arm = new THREE.Group();
  // 主臂
  const main = new THREE.Mesh(
    new THREE.BoxGeometry(TOWER_X - 6, 0.6, 1.2),
    new THREE.MeshStandardMaterial({ color: 0x8a3530, metalness: 0.6, roughness: 0.4 })
  );
  main.position.set(-((TOWER_X - 6) / 2 + 0), 0, 0);
  main.castShadow = true;
  arm.add(main);
  // 平台前端
  const tip = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.3, 2),
    platformMat
  );
  tip.position.set(-(TOWER_X - 6) + 1, -0.5, 0);
  arm.add(tip);
  // 脐带电缆 (若干下垂软管)
  for (let i = 0; i < 3; i++) {
    const cable = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 1.5, 6),
      new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 })
    );
    cable.position.set(-(TOWER_X - 6) + 1.5, -1.2, -0.5 + i * 0.5);
    arm.add(cable);
  }
  arm.position.set(TOWER_X, y, 0);
  launchTower.add(arm);
  serviceArms.push(arm);
});

// 顶部旋转起重机
{
  const crane = new THREE.Group();
  const mast = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.3, 18, 8),
    new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.7, roughness: 0.3 })
  );
  mast.position.y = 9;
  crane.add(mast);
  const jib = new THREE.Mesh(
    new THREE.BoxGeometry(20, 0.4, 0.4),
    new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.6, roughness: 0.3 })
  );
  jib.position.set(-8, 18, 0);
  jib.castShadow = true;
  crane.add(jib);
  // 钩子
  const hook = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.5, 0.6),
    new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8 })
  );
  hook.position.set(-8, 16.5, 0);
  crane.add(hook);
  crane.position.set(TOWER_X, towerH, 0);
  launchTower.add(crane);
}

// 顶部避雷针
{
  const lightRod = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.1, 6, 6),
    new THREE.MeshStandardMaterial({ color: 0xff5500, emissive: 0xff3300, emissiveIntensity: 0.4 })
  );
  lightRod.position.set(TOWER_X - 1, towerH + 3, 0);
  launchTower.add(lightRod);
}

scene.add(launchTower);

// ============ 火箭 (土星五号) ============
const rocket = new THREE.Group();
scene.add(rocket);

const SCALE = 0.8;
const ROCKET_BASE_Y = 4; // 火箭底端 (导流槽上方)

// 通用材质
function paint(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, roughness: opts.roughness ?? 0.55, metalness: opts.metalness ?? 0.35
  });
}

// 颜色
const C_BODY = 0xeeeae0;       // 主体白
const C_BLACK = 0x111111;      // 黑环
const C_S4B = 0xe2d8b8;        // 三级浅黄
const C_BURN = 0x222222;       // 烧灼
const C_COPPER = 0xc0a060;     // 铜色
const C_TILE = 0xfffaf0;       // 隔热瓦
const C_TILE_DARK = 0xc8b890;  // 隔热瓦阴影

// ============ S-IC 一级 ============
const s1c = new THREE.Group();
{
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(6.6, 6.6, 42, 64, 1, false),
    paint(C_BODY, { roughness: 0.5, metalness: 0.3 })
  );
  body.position.y = 21; body.castShadow = true; body.receiveShadow = true;
  s1c.add(body);

  // 黑白色环带
  for (let i = 0; i < 6; i++) {
    const ring = new THREE.Mesh(
      new THREE.CylinderGeometry(6.65, 6.65, 0.5, 64),
      paint(C_BLACK, { roughness: 0.7 })
    );
    ring.position.y = 4 + i * 7;
    s1c.add(ring);
  }

  // 底部 (略粗)
  const bottom = new THREE.Mesh(
    new THREE.CylinderGeometry(6.7, 6.4, 1.5, 64),
    paint(0x999999, { metalness: 0.6, roughness: 0.4 })
  );
  bottom.position.y = 0.75;
  s1c.add(bottom);

  // 隔热瓦接缝竖线
  for (let i = 0; i < 32; i++) {
    const angle = (i / 32) * Math.PI * 2;
    const seam = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, 41, 0.05),
      paint(0xaaaaa0, { roughness: 0.8 })
    );
    seam.position.set(Math.cos(angle) * 6.62, 21, Math.sin(angle) * 6.62);
    s1c.add(seam);
  }

  // 5个 F-1 发动机
  const f1Nozzles = [];
  for (let i = 0; i < 5; i++) {
    const angle = i * (Math.PI * 2 / 5);
    const r = i === 0 ? 0 : 2.8;
    const g = new THREE.Group();
    const nozzle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.95, 1.4, 3.5, 24),
      paint(0x2a2a2a, { metalness: 0.8, roughness: 0.3 })
    );
    nozzle.position.y = -1;
    g.add(nozzle);
    const bell = new THREE.Mesh(
      new THREE.CylinderGeometry(1.4, 1.95, 1.5, 24),
      paint(0x111111, { metalness: 0.9, roughness: 0.2 })
    );
    bell.position.y = -3.3;
    g.add(bell);
    // 内壁
    const inner = new THREE.Mesh(
      new THREE.CylinderGeometry(1.2, 0.6, 0.4, 24, 1, true),
      paint(0x442211, { metalness: 0.5, roughness: 0.6, side: THREE.BackSide })
    );
    inner.position.y = -4;
    g.add(inner);
    g.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
    s1c.add(g);
    f1Nozzles.push({ group: g, pos: g.position.clone(), angle, r });
  }
  s1c.userData.nozzles = f1Nozzles;

  // 顶部接口环

function makeUSAFlag() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  for (let i = 0; i < 13; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#b22234' : '#ffffff';
    ctx.fillRect(0, i * 512 / 13, 1024, 512 / 13);
  }
  ctx.fillStyle = '#3c3b6e';
  ctx.fillRect(0, 0, 412, 512 * 7 / 13);
  ctx.fillStyle = '#ffffff';
  for (let row = 0; row < 9; row++) {
    for (let col = 0; col < 11; col++) {
      ctx.beginPath();
      ctx.arc(20 + col * 36, 20 + row * 36, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  return new THREE.CanvasTexture(c);
}

let mode = 'assembled'; // 'assembled' | 'exploded' | 'sep1' | 'sep2' | 'sep3' | 'ignite'
let igniteTime = 0;
let launchProgress = 0; // 0..1, 升空进度
let preLaunch = true;

function setMode(newMode) {
  mode = newMode;
  const allBtns = [btnExplode, btnIgnite, btnSep1, btnSep2, btnSep3, btnReset];
  allBtns.forEach(b => b.classList.remove('active'));
  if (newMode === 'exploded') btnExplode.classList.add('active');
  else if (newMode === 'ignite') btnIgnite.classList.add('active');
  else if (newMode === 'sep1') btnSep1.classList.add('active');
  else if (newMode === 'sep2') btnSep2.classList.add('active');
  else if (newMode === 'sep3') btnSep3.classList.add('active');
  else if (newMode === 'assembled') btnReset.classList.add('active');

  btnSep1.disabled = (newMode === 'assembled' || newMode === 'exploded');
  btnSep2.disabled = (newMode !== 'sep1' && newMode !== 'sep2' && newMode !== 'sep3');
  btnSep3.disabled = (newMode !== 'sep2' && newMode !== 'sep3');

  if (newMode === 'ignite') {
    igniteTime = 0;
    shockTime = 0;
    launchProgress = 0;
    // 收回所有摆臂
    serviceArms.forEach(arm => arm.rotation.z = 0);
  } else {
    launchProgress = 0;
    // 切回非点火模式时清空烟雾
    if (newMode === 'assembled' || newMode === 'exploded' || newMode.startsWith('sep')) {
      smokeParticles.forEach(p => { scene.remove(p); p.geometry.dispose(); p.material.dispose(); });
      smokeParticles.length = 0;
    }
  }

  updateView();
}

function updateView() {
  const explodeY = {
    s1c: baseY.s1c - 15,
    s2: baseY.s2 + 12,
    s4b: baseY.s4b + 22,
    lmAdapter: baseY.lmAdapter + 28,
    lm: baseY.lm + 35,
    cm: baseY.cm + 42,
    tower: baseY.tower + 18
  };

  let activeY = { ...baseY };
  if (mode === 'exploded') activeY = explodeY;
  else if (mode === 'sep1') activeY.s1c = -10;
  else if (mode === 'sep2') { activeY.s1c = -20; activeY.s2 = -5; }
  else if (mode === 'sep3') { activeY.s1c = -30; activeY.s2 = -15; activeY.s4b = -5; }

  // 升空模式下火箭整体上移
  if (mode === 'ignite') {
    activeY = baseY; // 部件相对位置不变
  }

  const duration = 1000;
  const startTime = performance.now();
  const startPos = {};
  Object.keys(parts).forEach(k => startPos[k] = parts[k].position.y);

  function animate() {
    const t = Math.min(1, (performance.now() - startTime) / duration);
    const ease = 1 - Math.pow(1 - t, 3);
    Object.keys(parts).forEach(k => {
      parts[k].position.y = startPos[k] + (activeY[k] - startPos[k]) * ease;
    });
    if (t < 1) requestAnimationFrame(animate);
  }
  animate();

  const labels = {
    'assembled': '', 'exploded': '🔍 拆解视图',
    'ignite': '🚀 点火升空',
    'sep1': '① 一级分离 — S-IC 脱落',
    'sep2': '② 二级分离 — S-II 脱落',
    'sep3': '③ 三级分离 — S-IVB 脱落'
  };
  showLabel(labels[mode]);
}

function showLabel(text) {
  const el = document.getElementById('stageLabel');
  if (!text) { el.classList.remove('show'); return; }
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(window._labelTimer);
  window._labelTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// 初始状态
setMode('assembled');

// ============ 渲染循环 ============
const clock = new THREE.Clock();
function tick() {
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // 漂浮/微动 (只对拆解模式生效, 减少不必要的矩阵更新)
  if (mode === 'exploded') {
    Object.values(parts).forEach((p, i) => p.rotation.y = Math.sin(t * 0.5 + i) * 0.03);
  } else if (mode === 'assembled' && igniteTime < 3) {
    rocket.rotation.y = Math.sin(t * 0.1) * 0.005;
  }

  // 尾焰可见性
  let flameOpacity = 0;
  let trenchFlameOpacity = 0;

  if (mode === 'ignite') {
    igniteTime += dt;
    // 阶段1 (0-1s): 摆臂收回
    if (igniteTime < 1) {
      serviceArms.forEach((arm, i) => {
        arm.rotation.z = -igniteTime * Math.PI / 2 * (1 + i * 0.1);
      });
    } else {
      serviceArms.forEach(arm => arm.rotation.z = -Math.PI / 2);
    }
    // 阶段2 (1-2s): 点火, 尾焰渐显
    if (igniteTime > 1 && igniteTime < 2) {
      const p = (igniteTime - 1);
      flameOpacity = p;
      trenchFlameOpacity = p * 0.9;
      // 摆臂继续撤离
    }
    // 阶段3 (2-3s): 导流槽火焰全开, 震动波
    if (igniteTime > 2 && igniteTime < 3) {
      flameOpacity = 1;
      trenchFlameOpacity = 1;
      shockTime += dt;
    }
    // 阶段4 (3s+): 火箭升空
    if (igniteTime > 3) {
      flameOpacity = Math.max(0, 1 - (igniteTime - 3) * 0.3);
      trenchFlameOpacity = Math.max(0, 1 - (igniteTime - 3) * 0.5);
      launchProgress = Math.min(1, (igniteTime - 3) / 8);
      // 限制最大升空高度, 避免飞出场景
      const maxHeight = 180;
      const targetY = launchProgress * launchProgress * maxHeight;
      Object.values(parts).forEach(p => p.position.y = Math.min(targetY, p.position.y + dt * 35));
      // 升到顶就停
      if (launchProgress >= 1) {
        trenchFlameOpacity = 0;
        flameOpacity = 0;
      }
      // 持续喷烟 (限制数量避免卡死)
      if (smokeParticles.length < 60 && Math.random() < dt * 8) {
        makeSmokePuff(
          (Math.random() - 0.5) * 20,
          Math.random() * 3,
          (Math.random() - 0.5) * 20
        );
      }
    }
  } else {
    // 非点火模式: 尾焰隐藏
    flameOpacity = 0;
    trenchFlameOpacity = 0;
  }

  // 应用尾焰透明度 + 抖动
  mainFlames.forEach(fg => {
    fg.children.forEach(subGroup => {
      subGroup.children.forEach((flame, j) => {
        const flicker = 0.85 + Math.sin(t * 30 + j) * 0.15;
        if (j === 0) flame.material.opacity = flameOpacity * 0.7 * flicker; // 外焰
        else if (j === 1) flame.material.opacity = flameOpacity * 0.9 * flicker; // 中焰
        else flame.material.opacity = flameOpacity * 1.0 * flicker; // 内焰
        flame.scale.set(flicker, 0.9 + Math.sin(t * 25 + j) * 0.1, flicker);
      });
    });
  });

  // 导流槽火焰
  trenchFlame.material.opacity = trenchFlameOpacity * 0.85;
  trenchFlameCore.material.opacity = trenchFlameOpacity * 0.95;
  trenchFlame.scale.set(
    1 + Math.sin(t * 20) * 0.1,
    1 + Math.sin(t * 18) * 0.1,
    1 + Math.sin(t * 22) * 0.1
  );

  // 震动波扩散
  if (shockTime >= 0) {
    const ringR = shockTime * 80;
    shockRing.scale.setScalar(Math.max(0.1, ringR));
    shockRing.material.opacity = Math.max(0, 0.6 - shockTime * 0.4);
    if (shockTime > 2) shockTime = -1;
  } else {
    shockRing.material.opacity = 0;
  }

  // 烟雾粒子更新 (硬上限 80)
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const p = smokeParticles[i];
    p.userData.life += dt;
    p.position.add(p.userData.velocity);
    p.userData.velocity.y *= 0.99;
    p.material.opacity = 0.4 * (1 - p.userData.life / p.userData.maxLife);
    p.scale.setScalar(1 + p.userData.life * 0.5);
    if (p.userData.life > p.userData.maxLife) {
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      smokeParticles.splice(i, 1);
    }
  }
  // 紧急保护: 超出硬上限直接清空
  if (smokeParticles.length > 80) {
    smokeParticles.forEach(p => { scene.remove(p); p.geometry.dispose(); p.material.dispose(); });
    smokeParticles.length = 0;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

// 启动后等待渲染再隐藏 loading
setTimeout(() => {
  document.getElementById('loading').classList.add('gone');
  setTimeout(() => {
    showLabel('拖动旋转 · 滚轮缩放 · 试试点火升空');
  }, 500);
}, 300);

// ============ 自适应 ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
