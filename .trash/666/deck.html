<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>deck</title>
<style>

    --ink:#dff5ec;
    --mut:#7e9a90;
    --line:#14372c;
    --bg:#040706;

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}
  body{

    -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 80%);}
  #glow{position:absolute;width:1400px;height:1400px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,255,156,.10),rgba(0,255,156,0) 62%);}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 42%,rgba(0,0,0,.72) 100%);}

  /* ---------- 终端窗口 ---------- */
  #win{position:absolute;left:60px;top:56px;width:1800px;height:968px;
       border:1px solid var(--line);background:rgba(4,9,7,.72);
       box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 30px 90px rgba(0,0,0,.55), inset 0 0 90px rgba(0,255,156,.03);}

  #tc{color:var(--g);letter-spacing:.12em;}

  .scene{position:absolute;left:66px;top:70px;width:1668px;height:772px;}
  .kick{display:flex;align-items:center;gap:14px;margin-bottom:26px;font-size:19px;letter-spacing:.2em;}
  .kick .ph{color:#04120c;background:var(--g);padding:4px 12px;font-weight:700;}
  .kick .tg{color:var(--cy);letter-spacing:.24em;}
  .kick .ln{flex:0 0 60px;height:1px;background:var(--line);}
  .title{font-size:70px;line-height:1.18;font-weight:700;letter-spacing:.01em;
         color:#eafff6;text-shadow:0 0 26px rgba(0,255,156,.28);margin-bottom:26px;white-space:nowrap;}
  .caret{display:inline-block;width:16px;height:56px;background:var(--g);
         vertical-align:-8px;margin-left:8px;box-shadow:0 0 18px rgba(0,255,156,.7);}
  .lead{font-size:29px;line-height:1.62;color:#a8c4ba;max-width:1500px;margin-bottom:30px;}

        white-space:pre-wrap;box-shadow:0 0 34px rgba(34,227,255,.08), inset 0 0 40px rgba(0,0,0,.5);

  .code .s{color:var(--cy);}

       font-size:25px;line-height:1.5;color:#9fd8c4;letter-spacing:.01em;}

  #bar2 i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(0,255,156,.3),var(--g));
          box-shadow:0 0 12px rgba(0,255,156,.6);}
  #pg{font-size:15px;color:var(--g);letter-spacing:.14em;}
</style>
</head>

  if (!RENDER){
    var audio = new Audio('mixed.wav'), raf = 0, hud = document.getElementById('hud');
    hud.style.display='grid'; hud.style.cssText += 'position:absolute;inset:0;place-items:center;background:rgba(0,4,2,.75);cursor:pointer;font-size:20px;letter-spacing:.2em;color:#cfe';
    hud.textContent = '▶ CLICK / SPACE';
    function tick(){ if(!audio.paused){ window.__setTime(audio.currentTime*1000); raf=requestAnimationFrame(tick);} }
    function play(){ if(audio.currentTime*1000 > DUR-800) audio.currentTime=0; hud.style.display='none'; audio.play(); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
    hud.addEventListener('click', play);
    window.addEventListener('keydown', function(e){
      if(e.code==='Space'){ e.preventDefault(); if(audio.paused) play(); else { audio.pause(); hud.style.display='grid'; hud.textContent='▶ CLICK / SPACE'; } }
      if(e.code==='ArrowRight'){ audio.currentTime += 2; window.__setTime(audio.currentTime*1000); }
      if(e.code==='ArrowLeft'){ audio.currentTime = Math.max(0,audio.currentTime-2); window.__setTime(audio.currentTime*1000); }
    });
  }
})();
</script>
</body>
</html>
