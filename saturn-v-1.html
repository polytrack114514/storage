<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Saturn V 3D · LC-39A</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: -apple-system, "PingFang SC", sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; }
  #hud { position: fixed; top: 16px; left: 16px; z-index: 10; padding: 12px 16px;
    background: rgba(8,12,22,0.6); backdrop-filter: blur(8px); border: 1px solid rgba(120,180,255,0.2);
    border-radius: 10px; max-width: 280px; font-size: 13px; line-height: 1.7; }
  #hud h1 { font-size: 15px; color: #ffcf6b; margin-bottom: 4px; letter-spacing: 1px; }
  #hud .sub { font-size: 11px; opacity: 0.6; margin-bottom: 6px; }
  #hud kbd { display: inline-block; padding: 1px 5px; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 3px; font-size: 11px; background: rgba(255,255,255,0.06); }
  #info { position: fixed; top: 16px; right: 16px; z-index: 10; padding: 12px 16px;
    background: rgba(8,12,22,0.6); backdrop-filter: blur(8px); border: 1px solid rgba(120,180,255,0.2);
    border-radius: 10px; font-size: 12px; text-align: right; min-width: 200px; }
  #info .v { color: #ffcf6b; font-weight: bold; }
  #info .l { opacity: 0.5; font-size: 11px; }
  #controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 6px; padding: 8px; background: rgba(8,12,22,0.6);
    backdrop-filter: blur(8px); border: 1px solid rgba(120,180,255,0.2); border-radius: 10px;
    flex-wrap: wrap; justify-content: center; max-width: 95vw; }
  #controls button { background: rgba(120,180,255,0.1); color: #fff;
    border: 1px solid rgba(120,180,255,0.3); padding: 7px 12px;
    border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  #controls button:hover { background: rgba(120,180,255,0.25); }
  #controls button.active { background: rgba(255,207,107,0.25); border-color: #ffcf6b; color: #ffcf6b; }
  #label { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    padding: 5px 12px; background: rgba(255,207,107,0.2); border: 1px solid #ffcf6b;
    border-radius: 6px; color: #ffcf6b; font-size: 12px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap; }
  #label.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>SATURN V · LC-39A</h1>
  <div class="sub">肯尼迪航天中心 · 1969</div>
  <div><kbd>拖动</kbd> 旋转 · <kbd>滚轮</kbd> 缩放</div>
</div>
<div id="info">
  <div class="l">总高度</div><div class="v">110.6 m</div>
  <div class="l">起飞推力</div><div class="v">34,000 kN</div>
  <div class="l">LEO 运力</div><div class="v">118 t</div>
</div>
<div id="controls">
  <button id="btnExplode">🔍 拆解</button>
  <button id="btnIgnite">🔥 点火</button>
  <button id="btnReset">↻ 组装</button>
</div>
<div id="label"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a0f08, 0.0028);

// 渐变天空 (用一个 back-side 球)
{
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(1500, 16, 8),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: { top: { value: new THREE.Color(0x0a0f1f) }, mid: { value: new THREE.Color(0x4a2010) }, bot: { value: new THREE.Color(0xff7744) } },
      vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
      fragmentShader: 'uniform vec3 top,mid,bot; varying vec3 vP; void main(){ float h=normalize(vP).y; vec3 c=h>0.?mix(mid,top,smoothstep(0.,0.5,h)):mix(mid,bot,smoothstep(0.,-0.3,h)); gl_FragColor=vec4(c,1.); }'
    })
  );
  scene.add(sky);
}

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 3000);
camera.position.set(140, 80, 180);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 50, 0);
controls.minDistance = 50;
controls.maxDistance = 500;

// 光照
scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const sun = new THREE.DirectionalLight(0xffb070, 1.3);
sun.position.set(250, 200, 100);
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x6090ff, 0.25).translateX(-200).translateY(100).translateZ(-100));

// 星空 (1次绘制, 3k 点)
{
  const N = 2500;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 1500 + Math.random()*500;
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2*Math.random() - 1);
    pos[i*3] = r*Math.sin(p)*Math.cos(t);
    pos[i*3+1] = r*Math.cos(p);
    pos[i*3+2] = r*Math.sin(p)*Math.sin(t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.3, sizeAttenuation: true, transparent: true, opacity: 0.8 })));
}

// 远景山脉 (一个平面 + 渐变 canvas 贴图)
{
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#1a1525');
  grad.addColorStop(1, '#4a2530');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 256);
  // 山脊
  ctx.fillStyle = '#0d0a14';
  ctx.beginPath();
  ctx.moveTo(0, 256);
  for (let x = 0; x <= 1024; x += 8) {
    const y = 80 + Math.sin(x*0.02)*30 + Math.sin(x*0.05)*20 + Math.cos(x*0.1)*15;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(1024, 256); ctx.closePath(); ctx.fill();
  // 第二层
  ctx.fillStyle = '#1f1520';
  ctx.beginPath(); ctx.moveTo(0, 256);
  for (let x = 0; x <= 1024; x += 8) {
    const y = 130 + Math.sin(x*0.015+1)*25 + Math.cos(x*0.04+0.5)*18;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(1024, 256); ctx.closePath(); ctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  // 4 块, 围一圈
  for (let i = 0; i < 4; i++) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(2500, 600),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, fog: true })
    );
    const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
    m.position.set(Math.cos(a) * 1200, 100, Math.sin(a) * 1200);
    m.lookAt(0, 100, 0);
    scene.add(m);
  }
}

// 地面
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1500, 1500),
  new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.5;
scene.add(ground);

// 混凝土发射区
{
  const pad = new THREE.Mesh(
    new THREE.CircleGeometry(60, 32),
    new THREE.MeshStandardMaterial({ color: 0x6a6a6e, roughness: 0.9 })
  );
  pad.rotation.x = -Math.PI/2; pad.position.y = -0.3; scene.add(pad);
}

// 火焰导流槽
{
  const trench = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 22), new THREE.MeshStandardMaterial({color:0x111111}));
  trench.position.set(0, -2, 0); scene.add(trench);
  for (let s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 24), new THREE.MeshStandardMaterial({color:0x888880, roughness:0.95}));
    w.position.set(s*5, -0.5, 0); scene.add(w);
  }
}

// 发射塔
const tower = new THREE.Group();
const steel = new THREE.MeshStandardMaterial({ color: 0xc8453a, roughness: 0.5, metalness: 0.5 });
const plat = new THREE.MeshStandardMaterial({ color: 0x444a52, roughness: 0.5, metalness: 0.6 });
const TX = 28;
for (let i = 0; i < 4; i++) {
  const sx = (i%2===0?-1:1)*4, sz = (i<2?-1:1)*4;
  const c = new THREE.Mesh(new THREE.BoxGeometry(0.5, 110, 0.5), steel);
  c.position.set(TX+sx, 55, sz);
  tower.add(c);
}
[15, 32, 50, 68, 86, 102].forEach(y => {
  const p = new THREE.Mesh(new THREE.BoxGeometry(8, 0.4, 8), plat);
  p.position.set(TX, y, 0); tower.add(p);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(22, 0.3, 3), plat);
  arm.position.set(TX-11, y, 0); tower.add(arm);
  // 栏杆
  const rail = new THREE.MeshStandardMaterial({color: 0xffcf6b, metalness:0.7, roughness:0.3});
  for (let s of [-1, 1]) {
    const r = new THREE.Mesh(new THREE.BoxGeometry(22, 0.05, 0.05), rail);
    r.position.set(TX-11, y+0.7, s*1.5); tower.add(r);
  }
});
// 顶部起重机
{
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 15, 8), new THREE.MeshStandardMaterial({color:0xcccccc, metalness:0.7}));
  mast.position.set(TX, 117, 0); tower.add(mast);
  const jib = new THREE.Mesh(new THREE.BoxGeometry(15, 0.3, 0.3), new THREE.MeshStandardMaterial({color:0xdddddd, metalness:0.6}));
  jib.position.set(TX-6, 124, 0); tower.add(jib);
  const hook = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), new THREE.MeshStandardMaterial({color:0x444444, metalness:0.8}));
  hook.position.set(TX-6, 122.5, 0); tower.add(hook);
}
scene.add(tower);

// 4 根灯柱
[[80, 0, 60], [-80, 0, 60], [80, 0, -60], [-80, 0, -60]].forEach(([x, y, z]) => {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 28, 8), new THREE.MeshStandardMaterial({color:0x444444, metalness:0.6}));
  m.position.y = 14; g.add(m);
  const h = new THREE.Mesh(new THREE.BoxGeometry(3, 0.4, 1), new THREE.MeshStandardMaterial({color:0x222222}));
  h.position.y = 28; g.add(h);
  // 灯
  const lamp = new THREE.PointLight(0xffeebb, 0.3, 60, 2);
  lamp.position.y = 27.5; g.add(lamp);
  g.position.set(x, y, z); scene.add(g);
});

// 火箭
const rocket = new THREE.Group();
scene.add(rocket);
const RY = 4;
const paint = (c, m=0.35, r=0.55) => new THREE.MeshStandardMaterial({color:c, metalness:m, roughness:r});

// S-IC
const s1c = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.CylinderGeometry(6.6, 6.6, 42, 32), paint(0xeeeae0));
  body.position.y = 21; s1c.add(body);
  for (let i = 0; i < 5; i++) {
    const r = new THREE.Mesh(new THREE.CylinderGeometry(6.66, 6.66, 0.5, 32), paint(0x111111, 0.5, 0.7));
    r.position.y = 6 + i*8; s1c.add(r);
  }
  for (let i = 0; i < 5; i++) {
    const a = i*Math.PI*2/5, r = i===0?0:2.8;
    const n = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.4, 3, 16), paint(0x222222, 0.8, 0.3));
    n.position.set(Math.cos(a)*r, -1, Math.sin(a)*r); s1c.add(n);
    const b = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.9, 1.5, 16), paint(0x111111, 0.9, 0.2));
    b.position.set(Math.cos(a)*r, -3.3, Math.sin(a)*r); s1c.add(b);
  }
}
s1c.position.y = RY; rocket.add(s1c);

// S-II
const s2 = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.CylinderGeometry(6.6, 6.6, 25, 32), paint(0xeeeae0));
  body.position.y = 12.5; s2.add(body);
  for (let i = 0; i < 5; i++) {
    const a = i*Math.PI*2/5, r = i===0?0:2.6;
    const n = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.1, 2.5, 12), paint(0x222222, 0.8, 0.3));
    n.position.set(Math.cos(a)*r, -1, Math.sin(a)*r); s2.add(n);
  }
}
s2.position.y = RY+42.5; rocket.add(s2);

// S-IVB
const s4b = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.CylinderGeometry(4.1, 4.1, 12.5, 24), paint(0xe2d8b8));
  body.position.y = 6.25; s4b.add(body);
  const blk = new THREE.Mesh(new THREE.CylinderGeometry(4.12, 4.12, 0.4, 24), paint(0x111111));
  blk.position.y = 11.5; s4b.add(blk);
  const n = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.9, 1.8, 12), paint(0x222222, 0.8));
  n.position.y = -0.7; s4b.add(n);
}
s4b.position.y = RY+67.5; rocket.add(s4b);

// LM 适配器
const lmAd = new THREE.Group();
{
  const b = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 2.5, 24), paint(0xeeeeee));
  b.position.y = 1.25; lmAd.add(b);
}
lmAd.position.y = RY+80.5; rocket.add(lmAd);

// LM
const lm = new THREE.Group();
{
  const d = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.3, 3.2, 8), paint(0xd0d0c8, 0.6));
  d.position.y = 1.6; lm.add(d);
  for (let i=0;i<4;i++) {
    const a = (i/4)*Math.PI*2+Math.PI/4;
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4, 6), paint(0x888888, 0.8));
    leg.position.set(Math.cos(a)*1.8, 0, Math.sin(a)*1.8);
    leg.rotation.z = Math.cos(a)*0.4; leg.rotation.x = Math.sin(a)*0.4;
    lm.add(leg);
  }
  const asc = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 3.5, 12), paint(0xe8e8d8));
  asc.position.y = 5; lm.add(asc);
  // 窗口
  for (let s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.3), new THREE.MeshStandardMaterial({color:0x223344, metalness:0.9, roughness:0.1}));
    w.position.set(0, 5.5, s*1.81); if (s<0) w.rotation.y=Math.PI; lm.add(w);
  }
}
lm.position.y = RY+84.5; rocket.add(lm);

// 指令舱+服务舱
const cm = new THREE.Group();
{
  const top = new THREE.Mesh(new THREE.ConeGeometry(1.95, 3.4, 16), paint(0xc0a060, 0.6, 0.3));
  top.position.y = 1.7; cm.add(top);
  const sm = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 1.95, 7.5, 16), paint(0xd9d2bb));
  sm.position.y = -2; cm.add(sm);
  // 散热片 (8片)
  for (let i = 0; i < 8; i++) {
    const a = i/8*Math.PI*2;
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.08, 7, 0.5), paint(0xc8c0a8));
    f.position.set(Math.cos(a)*2.0, -2, Math.sin(a)*2.0);
    f.rotation.y = -a;
    cm.add(f);
  }
}
cm.position.y = RY+90; rocket.add(cm);

// 逃逸塔
const esc = new THREE.Group();
{
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 5, 6), paint(0xaaaaaa, 0.7));
  m.position.y = 2.5; esc.add(m);
  const c = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), paint(0x888888, 0.7));
  c.position.y = 5; esc.add(c);
}
esc.position.y = RY+95.5; rocket.add(esc);

// USA 旗帜
function flag() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  for (let i = 0; i < 13; i++) { x.fillStyle = i%2?'#fff':'#b22234'; x.fillRect(0, i*128/13, 256, 128/13); }
  x.fillStyle = '#3c3b6e'; x.fillRect(0, 0, 100, 128*7/13);
  x.fillStyle = '#fff';
  for (let r = 0; r < 5; r++) for (let c2 = 0; c2 < 6; c2++) {
    x.beginPath(); x.arc(10+c2*16, 10+r*16, 3, 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const flagTex = flag();
[1, -1].forEach(s => {
  const f = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.1), new THREE.MeshStandardMaterial({map:flagTex, side:THREE.DoubleSide, roughness:0.7}));
  f.position.set(s*2.2, RY+91, 0); f.rotation.y = s*0.1; rocket.add(f);
});

function txt(t, col='#1a1a1a') {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = col; x.font = 'bold 48px sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(t, 128, 32);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(7, 1.8), new THREE.MeshBasicMaterial({map:tex, transparent:true}));
}
[1, -1].forEach(s => {
  const u = txt('USA');
  u.position.set(0, RY+21, s*6.72);
  if (s<0) u.rotation.y = Math.PI;
  rocket.add(u);
});

rocket.scale.setScalar(0.8);

// ===== 尾焰 (复用5个外焰+1个核心) =====
const flames = [];
for (let i = 0; i < 5; i++) {
  const a = i*Math.PI*2/5, r = i===0?0:2.8;
  const g = new THREE.Group();
  const outer = new THREE.Mesh(new THREE.ConeGeometry(1.3, 14, 12, 1, true),
    new THREE.MeshBasicMaterial({color:0xff5522, transparent:true, opacity:0, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false}));
  outer.rotation.x = Math.PI; outer.position.y = -7; g.add(outer);
  const mid = new THREE.Mesh(new THREE.ConeGeometry(0.8, 10, 8, 1, true),
    new THREE.MeshBasicMaterial({color:0xffcc44, transparent:true, opacity:0, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false}));
  mid.rotation.x = Math.PI; mid.position.y = -5; g.add(mid);
  g.position.set(Math.cos(a)*r, -4.5, Math.sin(a)*r);
  s1c.add(g); flames.push(g);
}

// 导流槽火焰
const trenchFlame = new THREE.Mesh(
  new THREE.ConeGeometry(3, 10, 16, 1, true),
  new THREE.MeshBasicMaterial({color:0xffaa33, transparent:true, opacity:0, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false})
);
trenchFlame.position.set(0, -1, 0);
scene.add(trenchFlame);

// 冲击波环 (单 mesh, 缩放)
const shock = new THREE.Mesh(
  new THREE.RingGeometry(1, 1.3, 48),
  new THREE.MeshBasicMaterial({color:0xffaa44, transparent:true, opacity:0, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false})
);
shock.rotation.x = -Math.PI/2; shock.position.y = 0.1;
scene.add(shock);

// 烟雾池 (20个 sprite 复用)
const smokeTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,0.8)'); g.addColorStop(0.5, 'rgba(200,200,200,0.3)'); g.addColorStop(1, 'rgba(200,200,200,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  return t;
})();
const smokes = [];
for (let i = 0; i < 20; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex, color:0xdddddd, transparent:true, opacity:0, depthWrite:false}));
  s.scale.set(4, 4, 1);
  s.visible = false;
  scene.add(s);
  smokes.push(s);
}
let smokeIdx = 0;
function emitSmoke(x, y, z) {
  if (mode === 'assembled' || mode === 'exploded') return;
  const s = smokes[smokeIdx];
  smokeIdx = (smokeIdx+1) % smokes.length;
  s.visible = true; s.material.opacity = 0.5;
  s.position.set(x, y, z);
  s.scale.set(2, 2, 1);
  s.userData = { vy: 0.1 + Math.random()*0.1, vx: (Math.random()-0.5)*0.15, vz: (Math.random()-0.5)*0.15, life: 0, max: 3 + Math.random()*2 };
}

// ===== 模式控制 =====
const parts = { s1c, s2, s4b, lmAd, lm, cm, esc };
const baseY = { s1c: RY, s2: RY+42.5, s4b: RY+67.5, lmAd: RY+80.5, lm: RY+84.5, cm: RY+90, esc: RY+95.5 };
const explodeY = { s1c: RY-15, s2: RY+54, s4b: RY+89, lmAd: RY+108, lm: RY+119, cm: RY+132, esc: RY+113 };

let mode = 'assembled';
let igniteT = 0;
let liftProgress = 0;
let shockT = -1;

function setMode(m) {
  mode = m;
  ['btnExplode', 'btnIgnite', 'btnReset'].forEach(id => document.getElementById(id).classList.remove('active'));
  if (m==='exploded') document.getElementById('btnExplode').classList.add('active');
  else if (m==='ignite') document.getElementById('btnIgnite').classList.add('active');
  else document.getElementById('btnReset').classList.add('active');

  if (m === 'ignite') { igniteT = 0; liftProgress = 0; shockT = -1; }
  else if (m === 'assembled') {
    igniteT = 0; liftProgress = 0; shockT = -1;
    flames.forEach(g => g.children.forEach(f => f.material.opacity = 0));
    trenchFlame.material.opacity = 0; shock.material.opacity = 0;
    smokes.forEach(s => { s.visible = false; s.material.opacity = 0; });
  }

  // 拆解动画
  const targets = (m === 'exploded') ? explodeY : baseY;
  const start = performance.now();
  const startY = {};
  for (const k in parts) startY[k] = parts[k].position.y;
  const dur = 800;
  (function anim() {
    const t = Math.min(1, (performance.now() - start) / dur);
    const e = 1 - Math.pow(1-t, 3);
    for (const k in parts) parts[k].position.y = startY[k] + (targets[k] - startY[k]) * e;
    if (t < 1) requestAnimationFrame(anim);
  })();

  const labels = { exploded: '🔍 拆解视图', ignite: '🚀 点火升空', assembled: '↻ 复位' };
  showLabel(labels[m] || '');
}

function showLabel(t) {
  const el = document.getElementById('label');
  if (!t) { el.classList.remove('show'); return; }
  el.textContent = t; el.classList.add('show');
  clearTimeout(window._lt);
  window._lt = setTimeout(() => el.classList.remove('show'), 2500);
}

document.getElementById('btnExplode').onclick = () => setMode('exploded');
document.getElementById('btnIgnite').onclick = () => setMode('ignite');
document.getElementById('btnReset').onclick = () => setMode('assembled');

// ===== 渲染循环 =====
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05); // 限制 dt 防卡顿后跳跃
  const t = clock.getElapsedTime();

  // 微动
  if (mode === 'exploded') parts.forEach(p => p.rotation.y = Math.sin(t*0.4 + p.position.y*0.1) * 0.04);

  // 尾焰
  if (mode === 'ignite') {
    igniteT += dt;
    // 0-1.5s: 待机
    // 1.5-2.5s: 尾焰渐显
    // 2.5s+: 升空
    let fOp = 0, tOp = 0;
    if (igniteT > 1.5) fOp = Math.min(1, (igniteT - 1.5) * 2);
    if (igniteT > 2.0) tOp = Math.min(1, (igniteT - 2.0) * 3);
    if (igniteT > 3.5) {
      fOp = Math.max(0.3, 1 - (igniteT - 3.5) * 0.15);
      tOp = Math.max(0, 1 - (igniteT - 3.5) * 0.4);
      liftProgress = Math.min(1, (igniteT - 3.5) / 8);
      const lift = liftProgress * liftProgress * 200;
      // 平滑过渡
      for (const k in parts) {
        const cur = parts[k].position.y;
        const tgt = baseY[k] + lift;
        parts[k].position.y += (tgt - cur) * 0.1;
      }
      // 持续喷烟 (每帧 1 个)
      if (Math.random() < 0.4) emitSmoke((Math.random()-0.5)*15, 1, (Math.random()-0.5)*15);
    }
    // 冲击波 (2.5-3.5s)
    if (igniteT > 2.5 && igniteT < 4.0) {
      if (shockT < 0) shockT = 0;
      shockT += dt;
      shock.scale.setScalar(Math.max(0.1, shockT * 60));
      shock.material.opacity = Math.max(0, 0.6 - shockT * 0.4);
    } else if (igniteT >= 4.0) shock.material.opacity = 0;

    // 应用尾焰透明度 + 抖动
    const flick = 0.85 + Math.sin(t*30) * 0.15;
    flames.forEach((g, i) => {
      g.children[0].material.opacity = fOp * 0.6 * flick;
      g.children[1].material.opacity = fOp * 0.85 * flick;
      const s = 0.9 + Math.sin(t*25 + i) * 0.1;
      g.children[0].scale.set(s, 0.95, s);
      g.children[1].scale.set(s*0.9, 0.95, s*0.9);
    });
    trenchFlame.material.opacity = tOp * 0.9;
    trenchFlame.scale.set(1+Math.sin(t*20)*0.1, 1+Math.sin(t*18)*0.1, 1+Math.sin(t*22)*0.1);
  } else {
    flames.forEach(g => g.children.forEach(f => f.material.opacity = 0));
    trenchFlame.material.opacity = 0; shock.material.opacity = 0;
  }

  // 烟雾更新
  for (const s of smokes) {
    if (!s.visible) continue;
    s.userData.life += dt;
    s.position.y += s.userData.vy;
    s.position.x += s.userData.vx;
    s.position.z += s.userData.vz;
    s.userData.vy *= 0.98;
    const k = s.userData.life / s.userData.max;
    s.material.opacity = 0.5 * (1 - k);
    s.scale.setScalar(2 + k * 6);
    if (k >= 1) s.visible = false;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 初始提示
setTimeout(() => showLabel('试试点火 🔥'), 800);
</script>
</body>
</html>
